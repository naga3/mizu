<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>とぷるん</title>
<style>
html,body{margin:0;height:100%;background:#070b12;color:#d8ecf8;font-family:sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#fit{position:fixed;top:env(safe-area-inset-top);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left)}
#box{position:absolute;overflow:hidden;background:#000}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:none}
#rotate{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:100;display:none;text-align:center;font-size:15px;font-weight:bold;letter-spacing:.06em;color:rgba(235,246,255,.92);text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none}
#bar{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(560px,56%);height:12px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;display:flex;pointer-events:none}
#bar i{display:block;height:100%}
#bP{background:#4cf0b8}#bC{background:#d46bff}
#bar b{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;pointer-events:none}
#tkWin{background:#fff}#tkLose{background:#ff5a5a}
#goal{position:absolute;left:50%;top:62px;transform:translateX(-50%);font:bold 14px sans-serif;letter-spacing:.06em;color:rgba(235,246,255,.92);text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none;white-space:nowrap}
#cnt{position:absolute;left:50%;top:26px;transform:translateX(-50%);font:12px monospace;color:rgba(220,240,255,.75);pointer-events:none;white-space:pre}
#hud{position:absolute;left:10px;top:8px;font:12px/1.4 monospace;color:rgba(200,235,255,.6);pointer-events:none;white-space:pre}
#help{position:absolute;left:12px;bottom:10px;font-size:13px;line-height:1.7;color:rgba(215,238,252,.78);text-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:none}
#anchor{position:fixed;width:84px;height:84px;margin:-42px 0 0 -42px;border:2px dashed rgba(255,255,255,.35);border-radius:50%;pointer-events:none;display:none}
#ring{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid rgba(255,255,255,.7);border-radius:50%;pointer-events:none;display:none}
#ui{position:absolute;right:10px;top:8px;display:flex;gap:8px}
#ui button{width:44px;height:44px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;touch-action:manipulation}
#ui button::before{content:'';display:block;width:14px;height:16px;margin:auto;box-sizing:border-box;border-left:5px solid #fff;border-right:5px solid #fff}
#pause{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,10,24,.58);font-size:38px;font-weight:bold;letter-spacing:.12em}
#pauseBtns{display:flex;flex-direction:column;gap:12px;min-width:240px}
#pauseBtns button{font-size:max(16px,20px);padding:12px 28px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff;touch-action:manipulation}
#pauseBtns button.main{background:rgba(110,220,255,.32);border-color:rgba(190,240,255,.95)}
#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.35);font-size:40px;font-weight:bold}
#end button,#endBtns button{font-size:18px;padding:10px 24px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff}
#stage{position:absolute;left:50%;top:44px;transform:translateX(-50%);font:bold 13px sans-serif;letter-spacing:.12em;color:rgba(220,240,255,.85);pointer-events:none}
#stage.boss{color:#e0a0ff}
#intro{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:44px;font-weight:bold;letter-spacing:.1em;pointer-events:none;opacity:0;transition:opacity .5s;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#intro small{display:block;font-size:16px;font-weight:normal;letter-spacing:.2em;opacity:.8;margin-top:6px}
#endBtns{display:flex;gap:12px}
#endB2{display:none}
#box{container-type:size}
#title{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3cqh;background:radial-gradient(ellipse at 50% 45%,rgba(4,26,46,.35),rgba(2,10,20,.72));text-align:center}
#title h1{visibility:hidden;margin:0;font-size:min(22vh,12vw);font-size:22cqh;line-height:1;letter-spacing:.06em;font-weight:900;color:#eaffff;text-shadow:0 0 3cqh rgba(110,220,255,.85),0 .6cqh 4cqh rgba(0,40,80,.7)}
#title p{margin:0;font-size:max(11px,4.2cqh);letter-spacing:.14em;color:rgba(228,246,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.7)}
#ttlBtns{display:flex;gap:2.4cqh;margin-top:3cqh;flex-wrap:wrap;justify-content:center}
#ttlBtns button{font-size:max(15px,4.4cqh);padding:max(8px,1.6cqh) max(22px,5cqh);border-radius:999px;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.16);color:#fff;font-weight:bold;letter-spacing:.1em;text-shadow:0 1px 6px rgba(0,0,0,.5);touch-action:manipulation}
#ttlBtns button.main{background:rgba(110,220,255,.34);border-color:rgba(190,240,255,.95)}
#ttlBtns small{display:block;font-size:2.8cqh;font-weight:normal;letter-spacing:.12em;opacity:.9;margin-top:.4cqh}
#box.paused #goal,#box.paused #intro{display:none!important}
#box.onTitle #pause,#box.onTitle #bar,#box.onTitle #cnt,#box.onTitle #stage,#box.onTitle #goal,#box.onTitle #ui,#box.onTitle #intro,#box.onTitle #end{display:none!important}
#msg{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:#070b12;padding:16px;box-sizing:border-box;overflow:auto;-webkit-user-select:text;user-select:text}
#msgBox{max-width:min(680px,100%);max-height:100%;text-align:left;line-height:1.6}
#msgBox h2{margin:0 0 6px;font-size:24px;letter-spacing:.04em}
#msgBox p{margin:0 0 12px;font-size:14px;color:rgba(220,240,255,.85)}
#msgBox pre{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.08);font:12px/1.5 monospace;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text}
#msgBox button{font-size:15px;padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff}
#errBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:900;display:none;padding:8px 14px;border-radius:999px;background:rgba(160,40,40,.85);color:#fff;font-size:13px;white-space:nowrap}
.touch{display:none}
@media (pointer:coarse){
  .mouse{display:none}.touch{display:inline}
  #hud{display:none}
  #help{font-size:12px;line-height:1.6}
  #ring{width:34px;height:34px;margin:-17px 0 0 -17px}
  #endT{font-size:34px}
}
</style>
<div id="fit"><div id="box">
<canvas id="c"></canvas>
<div id="bar"><i id="bP"></i><i id="bC"></i><b id="tkLose"></b><b id="tkWin"></b></div>
<div id="cnt"></div>
<div id="hud"></div>
<div id="help"><span class="mouse">移動：マウス<br>撃つ：クリック（スペースキーでも）</span><span class="touch">移動：画面をなぞる<br>撃つ：もう1本の指でタップ</span></div>
<div id="ui"><button id="bPause" aria-label="ポーズ"></button></div>
<div id="stage"></div>
<div id="goal"></div>

</div></div>
<div id="anchor"></div>
<div id="ring"></div>
<div id="rotate">横向きにすると、大きく遊べます</div>

<div id="errBanner">エラーが発生しました（タップで詳細）</div>
<script>
// ---- エラー表示（ゲーム本体より先に読み込む。本体が途中で止まっても表示できるようにする）----
(function () {
  const $ = id => document.getElementById(id);
  function deviceInfo() {
    const L = [];
    L.push('UA: ' + navigator.userAgent);
    L.push(`画面: ${screen.width}x${screen.height}  表示領域: ${innerWidth}x${innerHeight}  dpr: ${window.devicePixelRatio}  タッチ: ${navigator.maxTouchPoints || 0}`);
    try {
      const c = document.createElement('canvas'), g2 = c.getContext('webgl2'), g1 = g2 ? null : (c.getContext('webgl') || c.getContext('experimental-webgl'));
      const g = g2 || g1;
      L.push('WebGL2: ' + (g2 ? 'あり' : 'なし') + '  WebGL1: ' + (g1 ? 'あり' : g2 ? '(WebGL2 があるので未確認)' : 'なし'));
      if (g) {
        const d = g.getExtension('WEBGL_debug_renderer_info');
        L.push('GPU: ' + (d ? g.getParameter(d.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER)));
        L.push('GL: ' + g.getParameter(g.VERSION) + '  最大テクスチャ: ' + g.getParameter(g.MAX_TEXTURE_SIZE));
        if (g2) L.push('EXT_color_buffer_float: ' + !!g.getExtension('EXT_color_buffer_float') + '  EXT_color_buffer_half_float: ' + !!g.getExtension('EXT_color_buffer_half_float'));
      }
    } catch (e) { L.push('WebGL 情報の取得に失敗: ' + e); }
    return L.join('\n');
  }
  let last = '';
  function open(title, sub, detail) {
    last = title + '\n' + detail + '\n\n' + deviceInfo();
    $('msgT').textContent = title; $('msgS').textContent = sub; $('msgD').textContent = detail + '\n\n--- 端末情報 ---\n' + deviceInfo();
    $('msg').style.display = 'flex';
  }
  // 動かせない端末（WebGL2 や浮動小数点の描画先がない等）
  let unsupported = false;
  window.showUnsupported = function (detail) {
    unsupported = true;
    open('サポート外の機種です', 'この端末・ブラウザでは、このゲームを動かせません。WebGL2 に対応した、新しいブラウザ（iOS 15 以降の Safari、最新の Chrome など）でお試しください。以下は、原因の詳細です。', detail);
  };
  // 想定外のエラー。ゲームが始まる前なら画面を止めて表示、始まった後なら小さな案内だけ出す
  let pending = null;
  function report(detail) {
    if (unsupported || pending) return; pending = detail;   // サポート外の画面を出したあとの、停止用の例外では上書きしない
    if (!window.__arena) { open('エラーが発生しました', 'ゲームを始められませんでした。以下は、エラーの詳細です。', detail); return; }
    $('errBanner').style.display = 'block';
  }
  $('errBanner').onclick = () => { open('エラーが発生しました', 'ゲームは動き続けていますが、問題が起きました。以下は、エラーの詳細です。', pending || ''); };
  window.addEventListener('error', e => report(`${e.message}\n  at ${(e.filename || '').split('/').pop()}:${e.lineno}:${e.colno}${e.error && e.error.stack ? '\n' + e.error.stack : ''}`));
  window.addEventListener('unhandledrejection', e => report('未処理の Promise エラー: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
  $('msgCopy').onclick = () => {
    const t = last; const done = () => { $('msgCopy').textContent = 'コピーしました'; setTimeout(() => { $('msgCopy').textContent = '詳細をコピー'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => { const r = document.createRange(); r.selectNodeContents($('msgD')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); });
    else { const r = document.createRange(); r.selectNodeContents($('msgD')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  };
})();
</script>
<script>
// ---SIM-BEGIN---

const HR = 12;                 // 影響半径
const SP = HR * 0.5;           // 静止時の粒子間隔
const MAXP = 9000;
const DT = 1 / 90;
const VMAX = 1800;

// double density relaxation (Clavet 2005) ＋ 表面張力。位置ベースなので大きな時間刻みでも壊れない
const PRM = { kneg: 0.2, eps: 0.002, iters: 3, beta: 0.01, coh: 0.06 };

const X = new Float32Array(MAXP), Y = new Float32Array(MAXP);
const PX = new Float32Array(MAXP), PY = new Float32Array(MAXP);
const VX = new Float32Array(MAXP), VY = new Float32Array(MAXP);
const HX = new Float32Array(MAXP), HY = new Float32Array(MAXP), HM = new Uint8Array(MAXP);   // タイトル文字の粒：ホーム位置にバネで戻る
const OWN = new Uint8Array(MAXP), FREE = new Float32Array(MAXP);   // 所有者(0=中立,1=あなた,2=CPU)、発射直後の操作不能時間
const DX = new Float32Array(MAXP), DY = new Float32Array(MAXP);
const RHO = new Float32Array(MAXP), RHN = new Float32Array(MAXP);
const CELL = new Int32Array(MAXP), ORDER = new Int32Array(MAXP);
let cellStart = new Int32Array(1), cursor = new Int32Array(1);
let n = 0, W = 800, WH = 600, gw = 1, gh = 1, gravity = 0, rho0 = 1, rhon0 = 1;
const ptr = { on: false, x: 0, y: 0, vx: 0, vy: 0, r: 70 };

function calibrate() {
  let r = 0, rn = 0;
  const s = SP, h = s * Math.sqrt(3) / 2;
  for (let a = -4; a <= 4; a++) for (let b = -4; b <= 4; b++) {
    if (!a && !b) continue;
    const d = Math.hypot(a * s + (b & 1 ? s / 2 : 0), b * h);
    if (d < HR) { const q = 1 - d / HR; r += q * q; rn += q * q * q; }
  }
  rho0 = r; rhon0 = rn;
}

function resizeWorld(w, h) {
  W = w; WH = h;
  gw = Math.ceil(W / HR) + 3; gh = Math.ceil(WH / HR) + 3;
  cellStart = new Int32Array(gw * gh + 2);
  cursor = new Int32Array(gw * gh + 2);
  for (let i = 0; i < n; i++) { X[i] = Math.min(Math.max(X[i], 1), W - 1); Y[i] = Math.min(Math.max(Y[i], 1), WH - 1); }
}

function buildGrid() {
  cellStart.fill(0);
  for (let i = 0; i < n; i++) {
    const c = ((Y[i] / HR | 0) + 1) * gw + ((X[i] / HR | 0) + 1);
    CELL[i] = c; cellStart[c + 1]++;
  }
  for (let c = 0; c < cellStart.length - 1; c++) cellStart[c + 1] += cellStart[c];
  cursor.set(cellStart);
  for (let i = 0; i < n; i++) ORDER[cursor[CELL[i]]++] = i;
}

function addParticle(x, y, vx, vy, own = 0) {
  if (n >= MAXP) return false;
  X[n] = x; Y[n] = y; PX[n] = x; PY[n] = y; VX[n] = vx; VY[n] = vy; OWN[n] = own; FREE[n] = 0; POW[n] = 0; HM[n] = 0; CACC[n] = 0; n++;
  np = 0;
  return true;
}

function spawnDrop(cx, cy, r, vx, vy, own = 0) {
  const h = SP * Math.sqrt(3) / 2;
  for (let row = -Math.ceil(r / h); row <= Math.ceil(r / h); row++) {
    const off = (row & 1) ? SP / 2 : 0;
    for (let col = -Math.ceil(r / SP); col <= Math.ceil(r / SP); col++) {
      const dx = col * SP + off, dy = row * h;
      if (dx * dx + dy * dy <= r * r) {
        const x = cx + dx + (Math.random() - .5) * .3, y = cy + dy + (Math.random() - .5) * .3;
        if (x > 2 && x < W - 2 && y > 2 && y < WH - 2 && !addParticle(x, y, vx, vy, own)) return;
      }
    }
  }
}

function spawnPool(height) {
  const h = SP * Math.sqrt(3) / 2;
  const rows = Math.floor(height / h);
  for (let row = 0; row < rows; row++) {
    const off = (row & 1) ? SP / 2 : 0;
    for (let x = 3 + off; x < W - 3; x += SP) if (!addParticle(x, WH - 3 - row * h, 0, 0)) return;
  }
}

let np = 0;   // ペア数。粒子数が変わったら古いペアを捨てる
const PI_ = new Int32Array(MAXP * 24), PJ_ = new Int32Array(MAXP * 24);

// 近傍ペア（i<j）を作る。cut までの距離のものだけ
function buildPairs(cut) {
  buildGrid();
  const c2 = cut * cut;
  np = 0;
  for (let i = 0; i < n; i++) {
    const xi = X[i], yi = Y[i], cx = xi / HR | 0, cy = yi / HR | 0;
    for (let rr = cy; rr <= cy + 2; rr++) {
      const b = rr * gw + cx;
      for (let k = cellStart[b], e = cellStart[b + 3]; k < e; k++) {
        const j = ORDER[k];
        if (j <= i) continue;
        const dx = X[j] - xi, dy = Y[j] - yi;
        if (dx * dx + dy * dy < c2 && np < PI_.length) { PI_[np] = i; PJ_[np] = j; np++; }
      }
    }
  }
}

function substep(dt) {
  const gdt = gravity * dt;
  for (let i = 0; i < n; i++) VY[i] += gdt;
  gameStep(dt);

  if (ptr.on) {
    const R = ptr.r, R2 = R * R;
    for (let i = 0; i < n; i++) {
      const dx = X[i] - ptr.x, dy = Y[i] - ptr.y, d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        const k = Math.min(1, (1 - d2 / R2) * 0.35);
        VX[i] += (ptr.vx - VX[i]) * k; VY[i] += (ptr.vy - VY[i]) * k;
      }
    }
  }

  // 粘性（近づく向きだけ）。前ステップで作った（余裕付きの）ペアを使い回す
  const beta = PRM.beta;
  for (let p = 0; p < np; p++) {
    const i = PI_[p], j = PJ_[p];
    const dx = X[j] - X[i], dy = Y[j] - Y[i], d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1e-4 || d >= HR) continue;
    const ux = dx / d, uy = dy / d;
    const u = (VX[i] - VX[j]) * ux + (VY[i] - VY[j]) * uy;
    let I = u > 0 ? -0.5 * beta * (1 - d / HR) * u : 0;
    VX[i] += I * ux; VY[i] += I * uy; VX[j] -= I * ux; VY[j] -= I * uy;
  }

  for (let i = 0; i < n; i++) {
    let vx = VX[i], vy = VY[i];
    const s2 = vx * vx + vy * vy;
    if (s2 > VMAX * VMAX) { const s = VMAX / Math.sqrt(s2); vx *= s; vy *= s; VX[i] = vx; VY[i] = vy; }
    PX[i] = X[i]; PY[i] = Y[i];
    X[i] = Math.min(Math.max(X[i] + vx * dt, 1), W - 1);
    Y[i] = Math.min(Math.max(Y[i] + vy * dt, 1), WH - 1);
  }

  // PBF: 密度拘束 C = rho/rho0 - 1 を反復で解く。負の C（表面の粒子）は弱く効かせる
  buildPairs(HR + 3);
  const coh = PRM.coh, kneg = PRM.kneg, eps = PRM.eps, DMAX = 0.2 * HR, irho = 1 / rho0, ih = -2 / HR * irho;
  for (let it = 0; it < PRM.iters; it++) {
    for (let i = 0; i < n; i++) { RHO[i] = 0; RHN[i] = 0; DX[i] = 0; DY[i] = 0; }   // RHO=密度, RHN=sum|g|^2
    // 勾配和は DX,DY に溜める
    for (let p = 0; p < np; p++) {
      const i = PI_[p], j = PJ_[p];
      const dx = X[i] - X[j], dy = Y[i] - Y[j], d2 = dx * dx + dy * dy;
      if (d2 >= HR * HR || d2 < 1e-10) continue;
      const d = Math.sqrt(d2), q = 1 - d / HR;
      RHO[i] += q * q; RHO[j] += q * q;
      const g = ih * q / d, gx = g * dx, gy = g * dy;   // i から見た勾配。j は逆符号
      DX[i] += gx; DY[i] += gy; DX[j] -= gx; DY[j] -= gy;
      const gg = g * g * d2; RHN[i] += gg; RHN[j] += gg;
    }
    for (let i = 0; i < n; i++) {
      let C = RHO[i] * irho - 1;
      if (C < 0) C *= kneg;
      RHO[i] = -C / (RHN[i] + DX[i] * DX[i] + DY[i] * DY[i] + eps);   // lambda
      DX[i] = 0; DY[i] = 0;
    }
    for (let p = 0; p < np; p++) {
      const i = PI_[p], j = PJ_[p];
      const dx = X[i] - X[j], dy = Y[i] - Y[j], d2 = dx * dx + dy * dy;
      if (d2 >= HR * HR || d2 < 1e-10) continue;
      const d = Math.sqrt(d2), q = 1 - d / HR;
      let f = (RHO[i] + RHO[j]) * ih * q / d;
      if (d > SP) f -= (OWN[i] === OWN[j] ? coh : coh * 0.25) * (d - SP) * q / d;   // 表面張力：間隔が開いた組を引き寄せる（位置ベースなので強くしても壊れない）
      const fx = f * dx, fy = f * dy;
      DX[i] += fx; DY[i] += fy; DX[j] -= fx; DY[j] -= fy;
    }
    for (let i = 0; i < n; i++) {
      let ax = DX[i], ay = DY[i];
      const m2 = ax * ax + ay * ay;
      if (m2 > DMAX * DMAX) { const k = DMAX / Math.sqrt(m2); ax *= k; ay *= k; }
      let x = X[i] + ax, y = Y[i] + ay;
      if (x < 1) x = 1; else if (x > W - 1) x = W - 1;
      if (y < 1) y = 1; else if (y > WH - 1) y = WH - 1;
      X[i] = x; Y[i] = y;
    }
  }

  const inv = 1 / dt;
  for (let i = 0; i < n; i++) { VX[i] = (X[i] - PX[i]) * inv; VY[i] = (Y[i] - PY[i]) * inv; }
}

// ---- ゲーム ----
const CACC = new Float32Array(MAXP), CANDE = new Float32Array(MAXP), CAND = new Uint8Array(MAXP);
const ROOT = new Int32Array(MAXP), BM = new Float32Array(MAXP), BX = new Float32Array(MAXP), BY = new Float32Array(MAXP);
const BVX = new Float32Array(MAXP), BVY = new Float32Array(MAXP), CAX = new Float32Array(MAXP), CAY = new Float32Array(MAXP);
const POW = new Float32Array(MAXP);   // 撃った直後の粒が持つ「勢い」。接触での押しの強さに効く
const mainRoot = [-1, -1, -1];
const GP = { M0: 100, ACC0: 800, DR: 2.2, VCAP: 650, K: 4, SPD: 300, NEUT: 0.35, SHOT: 950, CD: 1.0, P0: 0, PT: 1.5, PC: 0.22 };
const G = { title: false, share0: 0, rel: null, stage: 1, tx: 0, ty: 0, hasT: false, cd: [0, 0, 0], aiT: 0, ai: { tx: 0, ty: 0 }, neutT: 0, time: 0, own: [0, 0, 0] };

// 面ごとの難しさ。em=敵の初期質量、neut=中立の水の量、cd=CPUが撃てる間隔の倍率、aim=CPUの狙いのぶれ(rad)
const STAGES = [   // spd=CPUの移動速度の倍率（水が多いぶん、CPU が育つ勢いを抑える）
  { em: 25,  neut: 1.6,  cd: 5.0, aim: 1.0,  spd: .50 },
  { em: 35,  neut: 1.5,  cd: 4.4, aim: .85,  spd: .55 },
  { em: 45,  neut: 1.4,  cd: 3.8, aim: .7,   spd: .60 },
  { em: 56,  neut: 1.3,  cd: 3.2, aim: .58,  spd: .65 },
  { em: 68,  neut: 1.2,  cd: 2.7, aim: .46,  spd: .70 },
  { em: 80,  neut: 1.1,  cd: 2.2, aim: .35,  spd: .75 },
  { em: 91,  neut: 1.0,  cd: 1.8, aim: .25,  spd: .80 },
  { em: 110, neut: .9,   cd: 1.5, aim: .2,   spd: .85 },
  { em: 140, neut: .85,  cd: 1.2, aim: .15,  spd: .90 },
  { em: 280, neut: 1.0,  cd: 1.0, aim: .1,   spd: .80, boss: true },
];
function stageCfg() { return STAGES[Math.min(Math.max(G.stage, 1), STAGES.length) - 1]; }
// 画面が小さいほど敵の質量も小さくする（面積比）
function massScale() { return Math.min(1.3, Math.max(.4, W * WH / 921600)); }
const NEUT_DENSITY = 2;   // 中立の水の量の倍率（基準=画面面積/1800粒×0.85）
// 勝ち：あなた÷(あなた＋敵) がこの値以上。開始時の割合から相対的に決める（85%〜97%）
function winShare() { return Math.min(0.97, Math.max(0.85, G.share0 + 0.1)); }
const LOSE_SHARE = 0.15;
function neutralTarget() { return W * WH / 1800 * 0.85 * stageCfg().neut * NEUT_DENSITY; }

function find(i) { while (ROOT[i] !== i) { ROOT[i] = ROOT[ROOT[i]]; i = ROOT[i]; } return i; }

// 同じ所有者でつながった粒の集まり（水滴）ごとに質量・重心・速度を出す
function analyze() {
  for (let i = 0; i < n; i++) ROOT[i] = i;
  for (let p = 0; p < np; p++) {
    const i = PI_[p], j = PJ_[p];
    if (OWN[i] !== OWN[j]) continue;
    const dx = X[i] - X[j], dy = Y[i] - Y[j];
    if (dx * dx + dy * dy >= HR * HR) continue;
    const a = find(i), b = find(j);
    if (a !== b) ROOT[a] = b;
  }
  for (let i = 0; i < n; i++) { BM[i] = 0; BX[i] = 0; BY[i] = 0; BVX[i] = 0; BVY[i] = 0; }
  for (let i = 0; i < n; i++) {
    const r = find(i); ROOT[i] = r;
    BM[r]++; BX[r] += X[i]; BY[r] += Y[i]; BVX[r] += VX[i]; BVY[r] += VY[i];
  }
  mainRoot[1] = mainRoot[2] = -1;
  for (let i = 0; i < n; i++) {
    const o = OWN[i];
    if (ROOT[i] === i && o > 0 && (mainRoot[o] < 0 || BM[i] > BM[mainRoot[o]])) mainRoot[o] = i;
  }
}

// 接触面の吸収：大きい（速い）水滴の側へ、触れた粒の所有者が少しずつ変わる
function convert(dt) {
  for (let i = 0; i < n; i++) CANDE[i] = 0;
  const spd2 = GP.SPD * GP.SPD;
  for (let p = 0; p < np; p++) {
    const i = PI_[p], j = PJ_[p];
    if (OWN[i] === OWN[j]) continue;
    const dx = X[i] - X[j], dy = Y[i] - Y[j], d2 = dx * dx + dy * dy;
    if (d2 >= HR * HR) continue;
    // 撃った粒は触れた敵の粒を一瞬で奪い、勢いを渡す（砲弾のように相手を貫いて塊を持ち去る）
    if (POW[i] > 0.3 && POW[j] < 0.3) { OWN[j] = OWN[i]; VX[j] = VX[i]; VY[j] = VY[i]; POW[j] = 0; CACC[j] = 0; POW[i] -= GP.PC; continue; }
    if (POW[j] > 0.3 && POW[i] < 0.3) { OWN[i] = OWN[j]; VX[i] = VX[j]; VY[i] = VY[j]; POW[i] = 0; CACC[i] = 0; POW[j] -= GP.PC; continue; }
    const q = 1 - Math.sqrt(d2) / HR;
    let Ei = BM[ROOT[i]] * (1 + (VX[i] * VX[i] + VY[i] * VY[i]) / spd2 + GP.P0 * POW[i]);
    let Ej = BM[ROOT[j]] * (1 + (VX[j] * VX[j] + VY[j] * VY[j]) / spd2 + GP.P0 * POW[j]);
    if (!OWN[i]) Ei *= GP.NEUT;
    if (!OWN[j]) Ej *= GP.NEUT;
    const dj = Ej / (Ei + Ej);
    if (dj > 0.5) { CACC[i] += GP.K * (2 * dj - 1) * q * dt; if (Ej > CANDE[i]) { CANDE[i] = Ej; CAND[i] = OWN[j]; } }
    else if (dj < 0.5) { CACC[j] += GP.K * (1 - 2 * dj) * q * dt; if (Ei > CANDE[j]) { CANDE[j] = Ei; CAND[j] = OWN[i]; } }
  }
  const dec = Math.max(0, 1 - 3 * dt);
  for (let i = 0; i < n; i++) {
    if (POW[i] > 0) POW[i] = Math.max(0, POW[i] - dt / GP.PT);
    if (CACC[i] >= 1 && CANDE[i] > 0) { OWN[i] = CAND[i]; CACC[i] = 0; POW[i] = 0; } else CACC[i] *= dec;
  }
}

// 水滴ごとに目標へ向けて加速。大きいほど鈍い。ドラッグは水滴の平均速度にだけ掛けるので形は崩れない
function control(dt) {
  const mr2 = mainRoot[2];
  for (let i = 0; i < n; i++) {
    CAX[i] = 0; CAY[i] = 0;
    const o = OWN[i];
    if (ROOT[i] !== i || !o) continue;
    const m = BM[i], cx = BX[i] / m, cy = BY[i] / m;
    let tx, ty;
    if (o === 1) {
      if (G.rel) { tx = cx + G.rel.dx; ty = cy + G.rel.dy; }       // タッチ：触れた点からの相対移動
      else if (G.hasT) { tx = G.tx; ty = G.ty; }
      else continue;
    }
    else if (i === mr2) { tx = G.ai.tx; ty = G.ai.ty; }
    else if (mr2 >= 0) { tx = BX[mr2] / BM[mr2]; ty = BY[mr2] / BM[mr2]; }
    else continue;
    const dx = tx - cx, dy = ty - cy, dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1) continue;
    const k = o === 2 ? stageCfg().spd : 1;
    const s = Math.min(1, dist / 50), a = k * Math.min(GP.VCAP * GP.DR, GP.ACC0 * Math.sqrt(GP.M0 / m));
    CAX[i] = dx / dist * s * a; CAY[i] = dy / dist * s * a;
  }
  for (let i = 0; i < n; i++) {
    if (!OWN[i]) continue;
    if (FREE[i] > 0) { FREE[i] -= dt; continue; }
    const r = ROOT[i], m = BM[r];
    VX[i] += (CAX[r] - GP.DR * BVX[r] / m) * dt;
    VY[i] += (CAY[r] - GP.DR * BVY[r] / m) * dt;
  }
}

// 一番大きい自分の水滴の進行方向側から、ひとかたまりを撃ち出す。反動で本体は逆へ動く
function shoot(o, dx, dy) {
  const r = mainRoot[o];
  if (G.cd[o] > 0 || r < 0 || BM[r] < 28) return false;
  const m = BM[r], l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
  if (o === 2) { const a = (Math.random() - .5) * stageCfg().aim * 2, c = Math.cos(a), s = Math.sin(a); [dx, dy] = [dx * c - dy * s, dx * s + dy * c]; }   // CPU は狙いが甘い
  const cx = BX[r] / m, cy = BY[r] / m, vx = BVX[r] / m, vy = BVY[r] / m;
  const R = SP * Math.sqrt(m * 0.866 / Math.PI), px = cx + dx * R, py = cy + dy * R;
  const idx = [];
  for (let i = 0; i < n; i++) if (ROOT[i] === r) idx.push(i);
  idx.sort((a, b) => ((X[a] - px) ** 2 + (Y[a] - py) ** 2) - ((X[b] - px) ** 2 + (Y[b] - py) ** 2));
  const N = Math.min(Math.max(6, Math.round(m * 0.1)), 26, m - 10);
  const rec = GP.SHOT * N / (m - N) * 0.6;
  for (let k = 0; k < idx.length; k++) {
    const i = idx[k];
    if (k < N) { VX[i] = vx + dx * GP.SHOT; VY[i] = vy + dy * GP.SHOT; FREE[i] = 1.1; POW[i] = 1; }
    else { VX[i] -= dx * rec; VY[i] -= dy * rec; }
  }
  G.cd[o] = o === 2 ? GP.CD * stageCfg().cd : GP.CD;
  return true;
}

function aiThink(dt) {
  G.aiT -= dt; if (G.aiT > 0) return; G.aiT = 0.12;
  const mr = mainRoot[2];
  if (mr < 0) return;
  const mm = BM[mr], cx = BX[mr] / mm, cy = BY[mr] / mm;
  let best = -1, bestS = 0, thr = -1, thrD = 1e9, har = -1, harD = 1e9;
  for (let r = 0; r < n; r++) {
    if (ROOT[r] !== r || OWN[r] === 2) continue;
    const m = BM[r], x = BX[r] / m, y = BY[r] / m, d = Math.hypot(x - cx, y - cy);
    if (OWN[r] === 1 && m > mm * 1.15) { if (d < 380 && d < thrD) { thr = r; thrD = d; } }
    else if (m < mm * 0.85) { const s = Math.sqrt(m) / (d + 60) * (OWN[r] === 1 ? 2 : 1); if (s > bestS) { bestS = s; best = r; } }
    else if (OWN[r] === 1 && d < harD) { har = r; harD = d; }
  }
  let tx = W / 2, ty = WH / 2;
  if (thr >= 0) {
    const x = BX[thr] / BM[thr], y = BY[thr] / BM[thr];
    let ax = cx - x, ay = cy - y; const l = Math.hypot(ax, ay) || 1; ax /= l; ay /= l;
    // 壁際では壁に沿って逃げる
    if (cx < 90 || cx > W - 90) ax = 0;
    if (cy < 90 || cy > WH - 90) ay = 0;
    if (!ax && !ay) { ax = -(y - cy) / l; ay = (x - cx) / l; }
    tx = Math.min(W - 40, Math.max(40, cx + ax * 260)); ty = Math.min(WH - 40, Math.max(40, cy + ay * 260));
    if (thrD < 300 && mm >= 40) shoot(2, x - cx, y - cy);
  } else if (best >= 0) {
    const m = BM[best]; tx = BX[best] / m + BVX[best] / m * 0.25; ty = BY[best] / m + BVY[best] / m * 0.25;
    if (har >= 0 && harD < 340 && mm >= 60 && Math.random() < 0.25) shoot(2, BX[har] / BM[har] - cx, BY[har] / BM[har] - cy);
  }
  G.ai.tx = tx; G.ai.ty = ty;
}

function nearBlob(x, y, margin) {
  for (let r = 0; r < n; r++) {
    if (ROOT[r] === r && OWN[r] && Math.hypot(BX[r] / BM[r] - x, BY[r] / BM[r] - y) < margin + SP * 0.6 * Math.sqrt(BM[r])) return true;
  }
  return false;
}

function spawnNeutrals(dt) {
  G.neutT -= dt; if (G.neutT > 0) return;
  G.neutT = 0.4 / NEUT_DENSITY;
  let cnt = 0; for (let i = 0; i < n; i++) if (!OWN[i]) cnt++;
  if (cnt > neutralTarget()) return;
  for (let t = 0; t < 12; t++) {
    const x = 40 + Math.random() * (W - 80), y = 40 + Math.random() * (WH - 80);
    if (nearBlob(x, y, 110)) continue;
    const a = Math.random() * 6.283;
    spawnDrop(x, y, 7 + Math.random() * 6, Math.cos(a) * 40, Math.sin(a) * 40, 0);
    return;
  }
}

function addHome(x, y) { if (addParticle(x, y, 0, 0, 0)) { HX[n - 1] = x; HY[n - 1] = y; HM[n - 1] = 1; } }

function gameStep(dt) {
  G.time += dt;
  if (G.title) {                 // タイトル：文字の粒をバネで元の位置へ。ゆっくり波打たせて、いつもぷるぷるさせる
    const K = 160, C = 3.5, F = 90, t = G.time;
    for (let i = 0; i < n; i++) {
      if (!HM[i]) continue;
      VX[i] += ((HX[i] - X[i]) * K - VX[i] * C) * dt;
      VY[i] += ((HY[i] - Y[i]) * K - VY[i] * C + F * Math.sin(2.4 * t + .012 * HX[i] + .02 * HY[i])) * dt;
    }
    return;
  }
  for (let o = 1; o < 3; o++) if (G.cd[o] > 0) G.cd[o] -= dt;
  analyze();
  convert(dt);
  aiThink(dt);
  control(dt);
  spawnNeutrals(dt);
}

function countOwners() {
  G.own[0] = G.own[1] = G.own[2] = 0;
  for (let i = 0; i < n; i++) G.own[OWN[i]]++;
  return G.own;
}

function newGame() {
  n = 0; np = 0; G.cd[1] = G.cd[2] = 0; G.time = 0; G.neutT = 0; G.aiT = 0;
  G.tx = W * .5; G.ty = WH * .5; G.hasT = false;
  const cfg = stageCfg(), em = cfg.em * massScale();
  const er = Math.sqrt(em * 31.2 / Math.PI);
  spawnDrop(W * .22, WH * .5, 31, 0, 0, 1);
  spawnDrop(W * .78, WH * .5, er, 0, 0, 2);
  const target = neutralTarget(), clear = er + 80;
  let cnt = 0;
  for (let t = 0; t < 2000 && cnt < target; t++) {
    const x = 40 + Math.random() * (W - 80), y = 40 + Math.random() * (WH - 80);
    if (Math.hypot(x - W * .22, y - WH * .5) < 110 || Math.hypot(x - W * .78, y - WH * .5) < clear) continue;
    const before = n;
    spawnDrop(x, y, 7 + Math.random() * 6, (Math.random() - .5) * 80, (Math.random() - .5) * 80, 0);
    cnt += n - before;
  }
  const c = countOwners();
  G.share0 = c[1] / Math.max(1, c[1] + c[2]);   // 開始時のあなたの割合。勝ちの基準はここから相対的に決める
}
// ---SIM-END---

function fail(m) { window.showUnsupported(m); throw new Error(m.split('\n')[0]); }
if (!gl) fail('原因: WebGL2 が使えません（getContext(\'webgl2\') が null を返しました）');
const extFloat = gl.getExtension('EXT_color_buffer_float'), extHalf = gl.getExtension('EXT_color_buffer_half_float');
function prog(vs, fs) {

  for (const [t, s_] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(t); gl.shaderSource(s, s_); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail(`原因: ${t === gl.VERTEX_SHADER ? '頂点' : 'フラグメント'}シェーダのコンパイルに失敗しました\n${gl.getShaderInfoLog(s)}`);
    gl.attachShader(p, s);

  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail(`原因: シェーダのリンクに失敗しました\n${gl.getProgramInfoLog(p)}`);
  return p;
}
// 密度場 RGBA16F：R=全体、G=あなた、B=CPU、A=速さ
const pProg = prog(`#version 300 es
in vec4 a;
uniform vec2 uW; uniform float uSize;
out float vS; flat out float vO;
void main(){
  gl_Position = vec4(a.x / uW.x * 2. - 1., 1. - a.y / uW.y * 2., 0., 1.);
  gl_PointSize = uSize; vS = a.z; vO = a.w;

const cProg = prog(`#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2. - 1., 0., 1.); }`,
`#version 300 es
precision highp float;
uniform sampler2D uF; uniform vec2 uRes; uniform vec2 uWorld; uniform float uDpr; uniform float uTime; uniform float uBoss; uniform float uTitle;
const float uLift = 1.;   // 水ではなく底を明るくして透明感を保つ（採用）
const int uFx = 193; const int uBg = 4; const int uTint = 0; const int uPop = -1;
const vec3 CP = vec3(.25,1.,.72), CC = vec3(1.,.26,.92);   // あなた=緑、敵=紫
out vec4 o;
const float ISO = 1.1;
bool on(int b){ return ((uFx >> b) & 1) == 1; }
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1.,0.)), f.x), mix(h21(i + vec2(0.,1.)), h21(i + vec2(1.,1.)), f.x), f.y);
}
float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 11.7; a *= .5; } return s; }
vec3 hsv(float h, float s, float v){ return v * mix(vec3(1.), clamp(abs(fract(h + vec3(0., .667, .333)) * 6. - 3.) - 1., 0., 1.), s); }

// 背景。屈折で歪んで見えるよう、模様のあるものを用意する。p は画面 px（y 上向き）
vec3 bg(vec2 p){

    c += vec3(.12,.26,.30) * exp(-5. * length((uv - vec2(.28,.82)) * vec2(1.,.8)));
    c += vec3(.20,.10,.22) * .6 * exp(-7. * length((uv - vec2(.85,.35)) * vec2(1.,.8)));
    float cell = 56. * uDpr;
    vec2 g = abs(fract(p / cell) - .5);

    vec2 dd = (fract(p / cell) - .5) * cell;

  }
  if (uBg == 1) {            // 無地（暗い）

  }

    float cell = 80. * uDpr;
    vec2 g = abs(fract(p / cell) - .5);
    float line = smoothstep(.485, .5, max(g.x, g.y));
    return c * (1. - .35 * line);
  }
  if (uBg == 3) {            // 夜景のボケ
    vec3 c = mix(vec3(.01,.01,.03), vec3(.04,.03,.08), uv.y);
